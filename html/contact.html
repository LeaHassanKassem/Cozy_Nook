
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - The Cozy Nook</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/contact.css">
    <link rel="icon" type="image/x-icon" href="/images/favicon.png">
</head>
<body>
    <header>
        <h1>Contact Us</h1>
    </header>

    <nav class="navbar">
        <span class="menu-toggle" id="menu-toggle">&#9776;</span> <!-- ☰ -->
        <ul class="nav-links" id="nav-links">
            <li><a href="/html/index.html">Home</a></li>
            <li><a href="/html/services.html">Services</a></li>
            <li><a href="/html/team.html">About Us</a></li>
            <li><a href="/html/gallery.html">Gallery</a></li>
            <li><a href="/html/contact.html">Contact</a></li>
        </ul>
        <div class="cart-container">
            <a href="/html/cart.html" class="cart-link" style="text-decoration: none;">🛒 <span class="cart-count">0</span></a>
        </div>
    </nav>

    <main class="contact-container">
        <h2>Get in Touch</h2>
        <p>We’d love to hear from you! Reach out to us for any inquiries or support.</p>
        
        <div class="contact-form">
            <form action="#">
                <div class="form-row">
                    <div class="input-data">
                        <input type="text" required>
                        <div class="underline"></div>
                        <label for="">First Name</label>
                    </div>
                    <div class="input-data">
                        <input type="text" required>
                        <div class="underline"></div>
                        <label for="">Last Name</label>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="input-data">
                        <input type="email" required>
                        <div class="underline"></div>
                        <label for="">Email Address</label>
                    </div>
                    <div class="input-data">
                        <input type="text" required>
                        <div class="underline"></div>
                        <label for="">Website Name</label>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-data textarea">
                        <textarea rows="8" required></textarea>
                        <div class="underline"></div>
                        <label for="">Write your message</label>
                    </div>
                </div>

                <div class="form-row submit-btn">
                    <div class="input-data">
                        <div class="inner"></div>
                        <input type="submit" value="Submit">
                    </div>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 The Cozy Nook | All rights reserved.</p>
    </footer>
</body>
<script src="/js/contact.js"></script>

</html>
